<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>サロン管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  background: #f7f7f8;
  color: #222;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #f8f1f5, #f5f5f5);
}

.login-box {
  width: 100%;
  max-width: 380px;
  background: white;
  border-radius: 22px;
  padding: 30px 24px;
  box-shadow: 0 10px 40px rgba(0,0,0,.08);
  text-align: center;
}

.login-logo {
  font-size: 30px;
  margin-bottom: 8px;
}

.login-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}

.login-subtitle {
  color: #888;
  font-size: 14px;
  margin-bottom: 25px;
}

.password-input {
  width: 100%;
  height: 52px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 0 15px;
  text-align: center;
  font-size: 20px;
  letter-spacing: 5px;
  outline: none;
}

.password-input:focus {
  border-color: #999;
}

.login-button {
  width: 100%;
  height: 52px;
  margin-top: 14px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: white;
  font-weight: 600;
}

.login-error {
  color: #d33;
  font-size: 13px;
  margin-top: 12px;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #eee;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  min-height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
}

.logout-button {
  border: 1px solid #ddd;
  background: white;
  border-radius: 9px;
  padding: 8px 12px;
  font-size: 13px;
}

/* =========================
   MAIN
========================= */

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 15px 50px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* =========================
   HOME
========================= */

.home-title {
  font-size: 26px;
  font-weight: 700;
  margin: 10px 0 6px;
}

.home-date {
  color: #888;
  margin-bottom: 25px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.menu-card {
  border: 0;
  background: white;
  border-radius: 18px;
  padding: 25px 18px;
  text-align: left;
  box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.menu-icon {
  font-size: 32px;
  margin-bottom: 15px;
}

.menu-name {
  font-size: 18px;
  font-weight: 700;
}

.menu-description {
  margin-top: 6px;
  color: #888;
  font-size: 13px;
}

/* =========================
   PAGE HEADER
========================= */

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 23px;
  font-weight: 700;
}

.back-button {
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  padding: 9px 13px;
}

.refresh-button {
  border: 0;
  background: #222;
  color: white;
  border-radius: 10px;
  padding: 9px 13px;
}

/* =========================
   FILTER
========================= */

.filter-box {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 4px 18px rgba(0,0,0,.04);
}

.filter-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.field {
  flex: 1;
  min-width: 150px;
}

.field label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  min-height: 44px;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 9px 11px;
  background: white;
  outline: none;
}

.field textarea {
  min-height: 90px;
  resize: vertical;
}

/* =========================
   STATS
========================= */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat-card {
  background: white;
  border-radius: 15px;
  padding: 17px;
  box-shadow: 0 4px 18px rgba(0,0,0,.04);
}

.stat-label {
  font-size: 12px;
  color: #888;
}

.stat-value {
  margin-top: 7px;
  font-size: 22px;
  font-weight: 700;
}

/* =========================
   TABLE
========================= */

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,.04);
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 14px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th,
td {
  padding: 11px 9px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 13px;
  white-space: nowrap;
}

th {
  color: #777;
  font-weight: 600;
  background: #fafafa;
}

.action-button {
  border: 1px solid #ddd;
  background: white;
  border-radius: 8px;
  padding: 6px 9px;
  margin-right: 5px;
}

.delete-button {
  color: #c33;
}

/* =========================
   STAFF STATS
========================= */

.staff-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.staff-stat {
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 13px;
}

.staff-stat-name {
  font-weight: 700;
}

.staff-stat-number {
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal {
  width: 100%;
  max-width: 650px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 20px;
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 18px;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-actions button {
  flex: 1;
  min-height: 48px;
  border-radius: 11px;
  border: 0;
}

.save-button {
  background: #222;
  color: white;
}

.cancel-button {
  background: #eee;
  color: #333;
}

/* =========================
   PAYMENTS
========================= */

.payment-row {
  display: grid;
  grid-template-columns: 1fr 130px 45px;
  gap: 8px;
  margin-bottom: 9px;
}

.payment-row select,
.payment-row input {
  width: 100%;
  height: 43px;
  border: 1px solid #ddd;
  border-radius: 9px;
  padding: 8px;
}

.remove-payment {
  border: 0;
  background: #f3f3f3;
  border-radius: 9px;
}

.add-payment {
  border: 1px dashed #aaa;
  background: white;
  border-radius: 10px;
  padding: 9px 13px;
}

.total-box {
  background: #f7f7f7;
  border-radius: 11px;
  padding: 13px;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  font-weight: 700;
}

/* =========================
   CSV
========================= */

.export-button {
  border: 1px solid #ddd;
  background: white;
  border-radius: 10px;
  padding: 9px 13px;
}

/* =========================
   EMPTY
========================= */

.empty {
  padding: 30px 10px;
  text-align: center;
  color: #999;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  main {
    padding-left: 12px;
    padding-right: 12px;
  }

  .menu-grid {
    grid-template-columns: 1fr;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .staff-grid {
    grid-template-columns: 1fr;
  }

  .page-title {
    font-size: 21px;
  }

  .filter-row {
    display: block;
  }

  .field {
    margin-bottom: 10px;
  }

  .modal {
    padding: 17px;
  }
}
</style>
</head>

<header>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://isspcmbqmwgvchkttief.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5V4yaPwaEzSRXbN054Qyag_MpT7EZtX";

const API_URL =
  SUPABASE_URL + "/rest/v1";


/* =========================================================
   ADMIN PASSWORD
========================================================= */

const ADMIN_PASSWORD = "0122";


/* =========================================================
   DATA
========================================================= */

let staffList = [];
let attendanceRecords = [];
let serviceRecords = [];
let servicePayments = [];


/* =========================================================
   LOGIN
========================================================= */

function login() {

  const input =
    document.getElementById("passwordInput").value;

  const error =
    document.getElementById("loginError");


  if (input === ADMIN_PASSWORD) {

    sessionStorage.setItem(
      "mona_admin_login",
      "true"
    );

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    initializeApp();

  } else {

    error.classList.remove("hidden");

    document
      .getElementById("passwordInput")
      .select();

  }
}


document
  .getElementById("passwordInput")
  .addEventListener(
    "keydown",
    function(e) {

      if (e.key === "Enter") {
        login();
      }

    }
  );


function logout() {

  sessionStorage.removeItem(
    "mona_admin_login"
  );

  location.reload();

}


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      API_URL + endpoint,
      {
        ...options,

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json",
          ...(options.headers || {})
        }
      }
    );


  if (!response.ok) {

    const text =
      await response.text();

    throw new Error(
      text || "Supabase error"
    );

  }


  if (
    response.status === 204
  ) {
    return null;
  }


  return response.json();

}

/* =========================================================
   DATE
========================================================= */

function japanDate() {

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  ).format(
    new Date()
  );

}


function todayISO() {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(
      new Date()
    );

  const y =
    parts.find(
      x => x.type === "year"
    ).value;

  const m =
    parts.find(
      x => x.type === "month"
    ).value;

  const d =
    parts.find(
      x => x.type === "day"
    ).value;

  return `${y}-${m}-${d}`;

}

    ).value;

      `/service_records?select=*&service_date=gte.${start}&service_date=lte.${end}&order=service_date.desc,service_time.desc`;

          `/service_payments?select=*&service_record_id=in.(${ids})`

    );

  }

function getRecordPayments(
  recordId
) {

  return servicePayments.filter(
    p =>
      String(
        p.service_record_id
      ) ===
      String(recordId)
  );

}


function getRecordTotal(
  recordId
) {

  return getRecordPayments(
    recordId
  )
  .reduce(
    (
      sum,
      p
    ) =>
      sum +
      Number(
        p.amount || 0
      ),
    0
  );

}

/* =========================================================
   PAYMENT EDIT
========================================================= */

function addServicePayment(
  method = "現金",
  amount = ""
) {

  const container =
    document.getElementById(
      "editPayments"
    );


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "payment-row";


  const select =
    document.createElement(
      "select"
    );


  PAYMENT_METHODS.forEach(
    paymentMethod => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        paymentMethod;

      option.textContent =
        paymentMethod;

      if (
        paymentMethod ===
        method
      ) {
        option.selected =
          true;
      }

      select.appendChild(
        option
      );

    }
  );


  const input =
    document.createElement(
      "input"
    );

  input.type =
    "number";

  input.min =
    "0";

  input.step =
    "1";

  input.inputMode =
    "numeric";

  input.placeholder =
    "金額";

  input.value =
    amount || "";


  input.addEventListener(
    "input",
    calculateServiceEditTotal
  );


  const remove =
    document.createElement(
      "button"
    );

  remove.type =
    "button";

  remove.className =
    "remove-payment";

  remove.textContent =
    "×";


  remove.onclick =
    function() {

      row.remove();

      calculateServiceEditTotal();

    };


  row.appendChild(
    select
  );

  row.appendChild(
    input
  );

  row.appendChild(
    remove
  );


  container.appendChild(
    row
  );

}


function getServiceEditPayments() {

  const rows =
    document.querySelectorAll(
      "#editPayments .payment-row"
    );


  return Array.from(
    rows
  )
  .map(
    row => {

      const select =
        row.querySelector(
          "select"
        );

      const input =
        row.querySelector(
          "input"
        );


      return {
        payment_method:
          select.value,

        amount:
          Number(
            input.value || 0
          )
      };

    }
  )
  .filter(
    p =>
      p.amount > 0
  );

}


function calculateServiceEditTotal() {

  const payments =
    getServiceEditPayments();


  const total =
    payments.reduce(
      (
        sum,
        p
      ) =>
        sum +
        p.amount,
      0
    );


  document.getElementById(
    "editServiceTotal"
  ).textContent =
    yen(total);

}


/* =========================================================
   SAVE SERVICE
========================================================= */

async function saveServiceEdit() {

  const id =
    document.getElementById(
      "editServiceId"
    ).value;


  const serviceDate =
    document.getElementById(
      "editServiceDate"
    ).value;


  const serviceTime =
    document.getElementById(
      "editServiceTime"
    ).value;


  const customerName =
    document.getElementById(
      "editCustomerName"
    ).value.trim();


  const staffId =
    document.getElementById(
      "editServiceStaff"
    ).value;


  const source =
    document.getElementById(
      "editCustomerSource"
    ).value;


  const note =
    document.getElementById(
      "editServiceNote"
    ).value.trim();


  const payments =
    getServiceEditPayments();


  if (!serviceDate) {

    alert(
      "日付を入力してください"
    );

    return;

  }


  if (!serviceTime) {

    alert(
      "時間を入力してください"
    );

    return;

  }


  if (!staffId) {

    alert(
      "スタッフを選択してください"
    );

    return;

  }


  if (!payments.length) {

    alert(
      "支払い金額を入力してください"
    );

    return;

  }


  try {

    /* record */

    await supabaseFetch(
      `/service_records?id=eq.${encodeURIComponent(id)}`,
      {
        method: "PATCH",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify({

            service_date:
              serviceDate,

            service_time:
              serviceTime,

            customer_name:
              customerName ||
              null,

            staff_id:
              staffId,

            customer_source:
              source,

            note:
              note ||
              null

          })

      }
    );


    /* delete old payments */

    await supabaseFetch(
      `/service_payments?service_record_id=eq.${encodeURIComponent(id)}`,
      {
        method: "DELETE"
      }
    );


    /* insert new payments */

    await supabaseFetch(
      "/service_payments",
      {
        method: "POST",

        headers: {
          "Prefer":
            "return=minimal"
        },

        body:
          JSON.stringify(
            payments.map(
              p => ({
                service_record_id:
                  Number(id),

                payment_method:
                  p.payment_method,

                amount:
                  p.amount
              })
            )
          )
      }
    );


    closeServiceModal();

    await loadServiceDashboard();

    alert(
      "保存しました"
    );

  } catch(error) {

    console.error(error);

    alert(
      "保存に失敗しました"
    );

  }

}

            p =>
              `${p.payment_method} ${p.amount}`
          )
          .join(
            " / "
          );


      rows.push([

        record.service_date ||
          "",

        formatTime(
          record.service_time
        ),

        staffName(
          record.staff_id
        ),

        record.customer_name ||
          "",

        record.customer_source ||
          "",

        paymentText,

        getRecordTotal(
          record.id
        ),

        record.note ||
          ""

      ]);

    }
  );


  downloadCSV(
    rows,
    "サービス記録.csv"
  );

}


/* =========================================================
   CSV
========================================================= */

function downloadCSV(
  rows,
  filename
) {

  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(
                  value ?? ""
                )
                .replace(
                  /"/g,
                  '""'
                )}"`
            )
            .join(",")
      )
      .join("\r\n");


  const bom =
    "\uFEFF";


  const blob =
    new Blob(
      [
        bom +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(
    a
  );

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}


/* =========================================================
   UTILITIES
========================================================= */

function yen(
  amount
) {

  return "¥" +
    Number(
      amount || 0
    ).toLocaleString(
      "ja-JP"
    );

}


function formatTime(
  time
) {

  if (!time) {
    return "-";
  }


  return String(
    time
  ).substring(
    0,
    5
  );

}


function formatTimeForInput(
  time
) {

  if (!time) {
    return "";
  }


  return String(
    time
  ).substring(
    0,
    5
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
