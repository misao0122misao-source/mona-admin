<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>サロン管理</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    "Noto Sans JP",
    sans-serif;
  background: #f5f6f8;
  color: #222;
}

/* =========================
   共通
========================= */

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.page {
  min-height: 100vh;
}

/* =========================
   LOGIN
========================= */

.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    linear-gradient(
      135deg,
      #faf7f5,
      #f1eeee
    );
}

.login-box {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: 22px;
  padding: 35px 28px;
  box-shadow:
    0 12px 40px rgba(0,0,0,.08);
}

.login-logo {
  text-align: center;
  margin-bottom: 30px;
}

.login-logo h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 700;
}

.login-logo p {
  margin: 8px 0 0;
  color: #888;
  font-size: 13px;
}

.login-input {
  width: 100%;
  height: 52px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 0 15px;
  outline: none;
  text-align: center;
  letter-spacing: 4px;
  font-size: 18px;
}

.login-input:focus {
  border-color: #999;
}

.login-button {
  width: 100%;
  height: 52px;
  margin-top: 14px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: #fff;
  font-weight: 600;
}

.login-error {
  margin-top: 12px;
  color: #d33;
  font-size: 13px;
  text-align: center;
}

/* =========================
   HEADER
========================= */

.header {
  height: 64px;
  background: #fff;
  border-bottom: 1px solid #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-title {
  font-size: 18px;
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-date {
  color: #777;
  font-size: 13px;
}

.logout-button {
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12px;
}

/* =========================
   LAYOUT
========================= */

.layout {
  display: flex;
  min-height: calc(100vh - 64px);
}

.sidebar {
  width: 220px;
  background: #fff;
  border-right: 1px solid #e8e8e8;
  padding: 20px 12px;
  flex-shrink: 0;
}

.sidebar-section-title {
  font-size: 11px;
  color: #aaa;
  padding: 10px 12px;
  margin-top: 4px;
}

.nav-button {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 4px;
  color: #555;
}

.nav-button:hover {
  background: #f5f5f5;
}

.nav-button.active {
  background: #222;
  color: #fff;
}

.main {
  flex: 1;
  min-width: 0;
  padding: 24px;
}

/* =========================
   HOME
========================= */

.home-title {
  font-size: 24px;
  margin: 0 0 5px;
}

.home-subtitle {
  color: #888;
  font-size: 13px;
  margin-bottom: 25px;
}

.dashboard-grid {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));
  gap: 15px;
}

.dashboard-card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 16px;
  padding: 20px;
}

.dashboard-label {
  font-size: 13px;
  color: #888;
}

.dashboard-value {
  margin-top: 10px;
  font-size: 27px;
  font-weight: 700;
}

.dashboard-card-button {
  border: 0;
  background: #fff;
  width: 100%;
  text-align: left;
  padding: 0;
}

/* =========================
   PAGE HEADER
========================= */

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 18px;
}

.page-title {
  margin: 0;
  font-size: 23px;
}

.page-description {
  margin-top: 5px;
  color: #888;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  min-height: 40px;
  border-radius: 9px;
  border: 1px solid #ddd;
  background: #fff;
  padding: 0 14px;
  font-size: 13px;
}

.btn-primary {
  background: #222;
  color: #fff;
  border-color: #222;
}

.btn-danger {
  color: #d33;
  border-color: #eee;
}

.btn-small {
  min-height: 32px;
  padding: 0 10px;
  font-size: 12px;
}

/* =========================
   FILTER
========================= */

.filter-card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 18px;
}

.filter-grid {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(150px, 1fr));
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  color: #777;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: #fff;
  padding: 0 11px;
  outline: none;
}

.form-textarea {
  padding-top: 10px;
  min-height: 90px;
  resize: vertical;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: #999;
}

/* =========================
   TABLE
========================= */

.table-card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 15px;
  overflow: hidden;
}

.table-scroll {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

.data-table th {
  background: #fafafa;
  color: #777;
  font-size: 12px;
  font-weight: 500;
  text-align: left;
  padding: 13px 14px;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
}

.data-table td {
  padding: 13px 14px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  white-space: nowrap;
}

.data-table tbody tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: #fafafa;
}

.empty-row {
  text-align: center !important;
  color: #aaa;
  padding: 45px !important;
}

.action-cell {
  display: flex;
  gap: 6px;
}

/* =========================
   BADGE
========================= */

.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 11px;
  background: #f2f2f2;
  color: #555;
}

/* =========================
   STATS
========================= */

.stats-grid {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.stat-card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 18px;
}

.stat-label {
  color: #888;
  font-size: 12px;
}

.stat-value {
  margin-top: 7px;
  font-size: 23px;
  font-weight: 700;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.42);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal {
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 18px;
  box-shadow:
    0 20px 70px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 20px;
  border-bottom: 1px solid #eee;
}

.modal-title {
  margin: 0;
  font-size: 17px;
}

.modal-close {
  width: 32px;
  height: 32px;
  border: 0;
  background: #f3f3f3;
  border-radius: 50%;
  font-size: 18px;
}

.modal-body {
  padding: 20px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 15px 20px;
  border-top: 1px solid #eee;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {
  .sidebar {
    width: 180px;
  }

  .dashboard-grid,
  .stats-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .filter-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 700px) {

  .header {
    padding: 0 14px;
  }

  .header-date {
    display: none;
  }

  .layout {
    display: block;
  }

  .sidebar {
    width: 100%;
    border-right: 0;
    border-bottom: 1px solid #eee;
    padding: 8px;
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }

  .sidebar-section-title {
    display: none;
  }

  .nav-button {
    width: auto;
    white-space: nowrap;
    margin: 0;
  }

  .main {
    padding: 15px;
  }

  .page-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .dashboard-grid,
  .stats-grid,
  .filter-grid {
    grid-template-columns: 1fr;
  }

  .modal-backdrop {
    padding: 10px;
  }

  .modal {
    max-height: 94vh;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login-page">

  <div class="login-box">

    <div class="login-logo">
      <h1>サロン管理</h1>
      <p>管理者ログイン</p>
    </div>

    <input
      id="loginPassword"
      class="login-input"
      type="password"
      inputmode="numeric"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      ログイン
    </button>

    <div
      id="loginError"
      class="login-error"
    ></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div
  id="app"
  class="page hidden"
>

  <header class="header">

    <div class="header-title">
      サロン管理
    </div>

    <div class="header-right">

      <div
        id="headerDate"
        class="header-date"
      ></div>

      <button
        class="logout-button"
        onclick="logout()"
      >
        ログアウト
      </button>

    </div>

  </header>


  <div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-section-title">
        MENU
      </div>

      <button
        id="navHome"
        class="nav-button active"
        onclick="showPage('home')"
      >
        ホーム
      </button>

      <button
        id="navAttendance"
        class="nav-button"
        onclick="showPage('attendance')"
      >
        打刻管理
      </button>

      <button
        id="navServices"
        class="nav-button"
        onclick="showPage('services')"
      >
        売上・施術管理
      </button>

    </aside>


    <!-- MAIN -->

    <main class="main">


      <!-- =========================
           HOME
      ========================= -->

      <section
        id="pageHome"
        class="page-section"
      >

        <h1 class="home-title">
          サロン管理
        </h1>

        <div class="home-subtitle">
          スタッフ・打刻・施術データを管理できます。
        </div>

        <div class="dashboard-grid">

          <button
            class="dashboard-card dashboard-card-button"
            onclick="showPage('attendance')"
          >
            <div class="dashboard-label">
              本日の打刻
            </div>

            <div
              id="homeAttendanceCount"
              class="dashboard-value"
            >
              -
            </div>
          </button>


          <button
            class="dashboard-card dashboard-card-button"
            onclick="showPage('services')"
          >
            <div class="dashboard-label">
              本日の施術件数
            </div>

            <div
              id="homeServiceCount"
              class="dashboard-value"
            >
              -
            </div>
          </button>


          <div class="dashboard-card">

            <div class="dashboard-label">
              本日の売上
            </div>

            <div
              id="homeSales"
              class="dashboard-value"
            >
              ¥0
            </div>

          </div>


          <div class="dashboard-card">

            <div class="dashboard-label">
              現在の日付
            </div>

            <div
              id="homeToday"
              class="dashboard-value"
            >
              -
            </div>

          </div>

        </div>

      </section>


      <!-- =========================
           ATTENDANCE
      ========================= -->

      <section
        id="pageAttendance"
        class="page-section hidden"
      >

        <div class="page-header">

          <div>

            <h1 class="page-title">
              打刻管理
            </h1>

            <div class="page-description">
              スタッフの出勤・退勤時間を確認・編集できます。
            </div>

          </div>

          <div class="actions">

            <button
              class="btn"
              onclick="loadAttendance()"
            >
              更新
            </button>

            <button
              class="btn btn-primary"
              onclick="exportAttendanceCSV()"
            >
              CSV出力
            </button>

          </div>

        </div>


        <div class="filter-card">

          <div class="filter-grid">

            <div class="form-group">

              <label class="form-label">
                日付
              </label>

              <input
                id="attendanceDate"
                class="form-input"
                type="date"
                onchange="loadAttendance()"
              >

            </div>


            <div class="form-group">

              <label class="form-label">
                スタッフ
              </label>

              <select
                id="attendanceStaff"
                class="form-select"
                onchange="loadAttendance()"
              >

                <option value="">
                  全員
                </option>

              </select>

            </div>

          </div>

        </div>


        <div class="table-card">

          <div class="table-scroll">

            <table class="data-table">

              <thead>

                <tr>

                  <th>
                    日付
                  </th>

                  <th>
                    スタッフ
                  </th>

                  <th>
                    出勤
                  </th>

                  <th>
                    退勤
                  </th>

                  <th>
                    操作
                  </th>

                </tr>

              </thead>

              <tbody
                id="attendanceTableBody"
              ></tbody>

            </table>

          </div>

        </div>

      </section>


      <!-- =========================
           SERVICES
      ========================= -->

      <section
        id="pageServices"
        class="page-section hidden"
      >

        <div class="page-header">

          <div>

            <h1 class="page-title">
              売上・施術管理
            </h1>

            <div class="page-description">
              施術内容・担当スタッフ・支払方法・売上を管理できます。
            </div>

          </div>

          <div class="actions">

            <button
              class="btn"
              onclick="loadServices()"
            >
              更新
            </button>

            <button
              class="btn"
              onclick="openNewServiceModal()"
            >
              ＋ 施術登録
            </button>

            <button
              class="btn btn-primary"
              onclick="exportServiceCSV()"
            >
              CSV出力
            </button>

          </div>

        </div>


        <div class="filter-card">

          <div class="filter-grid">

            <div class="form-group">

              <label class="form-label">
                開始日
              </label>

              <input
                id="serviceStartDate"
                class="form-input"
                type="date"
                onchange="loadServices()"
              >

            </div>


            <div class="form-group">

              <label class="form-label">
                終了日
              </label>

              <input
                id="serviceEndDate"
                class="form-input"
                type="date"
                onchange="loadServices()"
              >

            </div>


            <div class="form-group">

              <label class="form-label">
                スタッフ
              </label>

              <select
                id="serviceStaff"
                class="form-select"
                onchange="loadServices()"
              >

                <option value="">
                  全員
                </option>

              </select>

            </div>

          </div>

        </div>


        <div class="stats-grid">

          <div class="stat-card">

            <div class="stat-label">
              施術件数
            </div>

            <div
              id="serviceCount"
              class="stat-value"
            >
              0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              売上
            </div>

            <div
              id="serviceSales"
              class="stat-value"
            >
              ¥0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              現金
            </div>

            <div
              id="serviceCash"
              class="stat-value"
            >
              ¥0
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              クレジットカード
            </div>

            <div
              id="serviceCard"
              class="stat-value"
            >
              ¥0
            </div>

          </div>

        </div>


        <div class="table-card">

          <div class="table-scroll">

            <table class="data-table">

              <thead>

                <tr>

                  <th>
                    日付
                  </th>

                  <th>
                    時間
                  </th>

                  <th>
                    お客様
                  </th>

                  <th>
                    スタッフ
                  </th>

                  <th>
                    支払方法
                  </th>

                  <th>
                    金額
                  </th>

                  <th>
                    操作
                  </th>

                </tr>

              </thead>

              <tbody
                id="serviceTableBody"
              ></tbody>

            </table>

          </div>

        </div>

      </section>

    </main>

  </div>

</div>


<!-- =========================
     ATTENDANCE MODAL
========================= -->

<div
  id="attendanceModal"
  class="modal-backdrop hidden"
>

  <div class="modal">

    <div class="modal-header">

      <h2 class="modal-title">
        打刻編集
      </h2>

      <button
        class="modal-close"
        onclick="closeAttendanceModal()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <input
        id="editAttendanceId"
        type="hidden"
      >


      <div class="form-group">

        <label class="form-label">
          出勤時間
        </label>

        <input
          id="editClockIn"
          class="form-input"
          type="time"
        >

      </div>


      <div
        class="form-group"
        style="margin-top:15px;"
      >

        <label class="form-label">
          退勤時間
        </label>

        <input
          id="editClockOut"
          class="form-input"
          type="time"
        >

      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn"
        onclick="closeAttendanceModal()"
      >
        キャンセル
      </button>

      <button
        class="btn btn-primary"
        onclick="saveAttendanceEdit()"
      >
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     SERVICE MODAL
========================= -->

<div
  id="serviceModal"
  class="modal-backdrop hidden"
>

  <div class="modal">

    <div class="modal-header">

      <h2
        id="serviceModalTitle"
        class="modal-title"
      >
        施術登録
      </h2>

      <button
        class="modal-close"
        onclick="closeServiceModal()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <input
        id="editServiceId"
        type="hidden"
      >


      <div class="form-group">

        <label class="form-label">
          日付
        </label>

        <input
          id="editServiceDate"
          class="form-input"
          type="date"
        >

      </div>


      <div
        class="form-group"
        style="margin-top:14px;"
      >

        <label class="form-label">
          時間
        </label>

        <input
          id="editServiceTime"
          class="form-input"
          type="time"
        >

      </div>


      <div
        class="form-group"
        style="margin-top:14px;"
      >

        <label class="form-label">
          お客様名
        </label>

        <input
          id="editCustomerName"
          class="form-input"
          type="text"
          placeholder="お客様名"
        >

      </div>


      <div
        class="form-group"
        style="margin-top:14px;"
      >

        <label class="form-label">
          スタッフ
        </label>

        <select
          id="editServiceStaff"
          class="form-select"
        ></select>

      </div>


      <div
        class="form-group"
        style="margin-top:14px;"
      >

        <label class="form-label">
          支払方法
        </label>

        <select
          id="editPaymentMethod"
          class="form-select"
        >

          <option value="現金">
            現金
          </option>

          <option value="クレジットカード">
            クレジットカード
          </option>

          <option value="PayPay">
            PayPay
          </option>

        </select>

      </div>


      <div
        class="form-group"
        style="margin-top:14px;"
      >

/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      API_URL + endpoint,
      {
        ...options,

        headers: {
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      "Supabase error"
    );

  }


  if (
    response.status === 204 ||
    !text
  ) {

    return null;

  }


  try {

    return JSON.parse(text);

  } catch {

    return text;

  }

}


/* =========================================================
   DATE
========================================================= */

function todayISO() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function formatDateJP(
  date
) {

  if (!date) {
    return "-";
  }

  const value =
    String(date);

  if (
    /^\d{4}-\d{2}-\d{2}/.test(
      value
    )
  ) {

    const datePart =
      value.substring(
        0,
        10
      );

    const parts =
      datePart.split("-");

    return (
      parts[0] +
      "/" +
      parts[1] +
      "/" +
      parts[2]
    );

  }

  return value;

}


/* =========================================================
   ★ 時間処理
   timestamp / timestamptz / time 全対応
========================================================= */

function formatTime(
  time
) {

  if (!time) {
    return "-";
  }


  const value =
    String(time);


  /*
   * Supabase timestamp
   *
   * 例：
   * 2026-09-30T15:56:10.831+00:00
   */

  if (
    value.includes("T")
  ) {

    const date =
      new Date(value);


    if (
      !isNaN(
        date.getTime()
      )
    ) {

      return date.toLocaleTimeString(
        "ja-JP",
        {
          timeZone:
            "Asia/Tokyo",

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false
        }
      );

    }

  }


  /*
   * PostgreSQL time
   *
   * 例：
   * 15:56:10
   */

  if (
    /^\d{2}:\d{2}/.test(
      value
    )
  ) {

    return value.substring(
      0,
      5
    );

  }


  return value;

}


/* =========================================================
   ★ input[type=time] 用
========================================================= */

function formatTimeForInput(
  time
) {

  if (!time) {
    return "";
  }


  const value =
    String(time);


  /*
   * timestamp / timestamptz
   */

  if (
    value.includes("T")
  ) {

    const date =
      new Date(value);


    if (
      !isNaN(
        date.getTime()
      )
    ) {

      return date.toLocaleTimeString(
        "ja-JP",
        {
          timeZone:
            "Asia/Tokyo",

          hour:
            "2-digit",

          minute:
            "2-digit",

          hour12:
            false
        }
      );

    }

  }


  /*
   * time
   */

  if (
    /^\d{2}:\d{2}/.test(
      value
    )
  ) {

    return value.substring(
      0,
      5
    );

  }


  return "";

}


/* =========================================================
   CURRENCY
========================================================= */

function formatYen(
  value
) {

  const number =
    Number(value || 0);

  return (
    "¥" +
    number.toLocaleString(
      "ja-JP"
    )
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   ATTENDANCE RENDER
========================================================= */

function renderAttendance() {

    document.getElementById(
      "attendanceTableBody"

  if (
    !attendanceRecords.length
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="empty-row"
        >
          打刻データがありません。
        </td>
      </tr>
    `;

    return;

  }


  tbody.innerHTML =
    attendanceRecords
      .map(
        record => {

          const staffName =
            getStaffName(
              record.staff_id
            );


          /*
           * 如果 staff_id 找不到，
           * 有些表可能直接存 staff_name。
           */

          const displayStaff =
            staffName !== "-"
              ? staffName
              : (
                  record.staff_name ||
                  "-"
                );


          return `
            <tr>

              <td>
                ${escapeHtml(
                  formatDateJP(
                    record.work_date
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  displayStaff
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(
                    record.clock_in
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(
                    record.clock_out
                  )
                )}
              </td>

              <td>

                <div class="action-cell">

                  <button
                    class="btn btn-small"
                    onclick="openAttendanceModal('${record.id}')"

                    編集
                  </button>

                  <button
                    class="btn btn-small btn-danger"
                    onclick="deleteAttendance('${record.id}')"
                  >
                    削除
                  </button>

                </div>

              </td>

            </tr>
          `;

        }
      )
      .join("");

}


/* =========================================================
   ★ ATTENDANCE EDIT
========================================================= */

function openAttendanceModal(
  recordId
) {

  const record =
    attendanceRecords.find(
      r =>
        String(
          r.id
        ) ===
        String(
          recordId
        )
    );

    );

  }


  document.getElementById(
    "editAttendanceId"
  ).value =

  /*
   * ★ 这里非常重要
   *
   * 数据库如果返回：
   *
   * 2026-09-30T15:56:10.831+00:00
   *
   * input[type=time] 不能直接接受。
   *
   * 所以转换成：
   *
   * 00:56
   *
   * 日本时间。
   */

  document.getElementById(
    "editClockIn"
  ).value =
    formatTimeForInput(
      record.clock_in
    );


  document.getElementById(
    "editClockOut"
  ).value =

      record.clock_out
    );


  document
    .getElementById(
      "attendanceModal"
    )
    .classList.remove(
      "hidden"
    );

}


/* =========================================================
   ★ ATTENDANCE SAVE
========================================================= */

async function saveAttendanceEdit() {

  const id =
    document.getElementById(
      "editAttendanceId"
    ).value;


  const clockIn =
    document.getElementById(
      "editClockIn"
    ).value;


  const clockOut =
    document.getElementById(
      "editClockOut"
    ).value;


  if (!id) {

    alert(
      "打刻IDがありません。"
    );

    return;

  }


  const record =
    attendanceRecords.find(
      r =>
        String(
          r.id
        ) ===
        String(
          id
        )
    );


  if (!record) {

    alert(
      "打刻記録が見つかりません。"
    );

    return;

  }


  try {

    /*
     * ★ 判断数据库字段类型
     *
     * 如果原本数据包含 T，
     * 说明大概率是 timestamp/timestamptz。
     */

    const originalTime =
      record.clock_in ||
      record.clock_out ||
      "";


    const isTimestamp =
      typeof originalTime ===
        "string" &&
      originalTime.includes(
        "T"
      );


    let updateData = {};


    if (
      isTimestamp
    ) {

      /*
       * timestamp / timestamptz
       *
       * work_date：
       * 2026-09-30
       *
       * clockIn：
       * 15:30
       *
       * 保存：
       * 2026-09-30T15:30:00+09:00
       */

      const workDate =
        record.work_date;


      if (!workDate) {

        throw new Error(
          "work_date がありません。"
        );

      }


      updateData.clock_in =
        clockIn
          ? `${workDate}T${clockIn}:00+09:00`
          : null;


      updateData.clock_out =
        clockOut
          ? `${workDate}T${clockOut}:00+09:00`
          : null;

    } else {

      /*
       * PostgreSQL time
       */

      updateData.clock_in =
        clockIn ||
        null;


      updateData.clock_out =
        clockOut ||
        null;

    }


    console.log(
      "Attendance ID:",
      id
    );

    console.log(
      "Original record:",
      record
    );

    console.log(
      "Timestamp:",
      isTimestamp
    );

    console.log(
      "Update data:",
      updateData
    );


    /*
     * ★ 直接 fetch
     *
     * return=representation
     * を付けて、Supabaseが実際に更新した
     * データを返してもらう。
     */

    const response =
      await fetch(
        API_URL +
        `/attendance?id=eq.${encodeURIComponent(id)}`,
        {
          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              updateData
            )

        }
      );


    const responseText =
      await response.text();


    console.log(
      "HTTP STATUS:",
      response.status
    );

    console.log(
      "SUPABASE RESPONSE:",
      responseText
    );


    /*
     * HTTP错误
     */

    if (
      !response.ok
    ) {

      alert(
        "保存に失敗しました\n\n" +
        "HTTP：" +
        response.status +
        "\n\n" +
        responseText
      );

      return;

    }


    /*
     * 没有返回数据
     */

    if (
      !responseText
    ) {

      /*
       * 有些 Supabase 设置下
       * 即使成功也可能没有返回。
       *
       * 这里不直接判定失败，
       * 再重新读取确认。
       */

      await loadAttendance();

      const updated =
        attendanceRecords.find(
          r =>
            String(
              r.id
            ) ===
            String(
              id
            )
        );


      if (updated) {

        closeAttendanceModal();

        alert(
          "保存しました"
        );

      } else {

        alert(
          "保存結果を確認できませんでした。"
        );

      }

      return;

    }


    let result;


    try {

      result =
        JSON.parse(
          responseText
        );

    } catch(error) {

      console.error(
        error
      );

      alert(
        "保存に失敗しました\n\n" +
        responseText
      );

      return;

    }


    console.log(
      "UPDATE RESULT:",
      result
    );


    /*
     * PATCH成功但0件
     */

    if (
      !Array.isArray(
        result
      ) ||
      result.length === 0
    ) {

      alert(
        "保存に失敗しました\n\n" +
        "更新対象の打刻データが見つかりませんでした。\n\n" +
        "ID：" +
        id
      );

      return;

    }


    /*
     * 成功
     */

    closeAttendanceModal();

    await loadAttendance();

    await loadHome();

    alert(
      "保存しました"
    );

  } catch(error) {

    console.error(
      "Attendance UPDATE ERROR:",
      error
    );


    alert(
      "保存に失敗しました\n\n" +
      error.message
    );

  }

}


/* =========================================================
   ATTENDANCE DELETE
========================================================= */

async function deleteAttendance(
  id
) {

  if (
    !confirm(
      "この打刻記録を削除しますか？"
    )
  ) {

    return;

  }


  try {

/* =========================================================
   SERVICE
========================================================= */

function getServiceDate(
  record
) {

  return (
    record.service_date ||
    record.work_date ||
    record.date ||
    ""
  );

}


function getServiceTime(
  record
) {

  return (
    record.service_time ||
    record.time ||
    ""
  );

}


function getServiceCustomer(
  record
) {

  return (
    record.customer_name ||
    record.customer ||
    record.client_name ||
    ""
  );

}


function getServiceStaffId(
  record
) {

  return (
    record.staff_id ||
    ""
  );

}


function getServiceAmount(
  record
) {

  return Number(
    record.amount ??
    record.price ??
    record.total_amount ??
    0
  );

}


function getServicePayment(
  record
) {

  return (
    record.payment_method ||
    record.payment ||
    record.payment_type ||
    ""
  );

}


function getServiceNote(
  record
) {

  return (
    record.note ||
    ""
  );

}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices() {

  const start =
    document.getElementById(
      "serviceStartDate"
    ).value ||
    todayISO();


  const end =
    document.getElementById(
      "serviceEndDate"
    ).value ||
    todayISO();


  const staffId =
    document.getElementById(
      "serviceStaff"
    ).value;


  /*
   * 这里使用 service_date。
   */

  let query =
    `/service_records?select=*&service_date=gte.${start}&service_date=lte.${end}&order=service_date.desc`;


  if (
    staffId
  ) {

    query +=
      `&staff_id=eq.${encodeURIComponent(staffId)}`;

  }


  try {

    serviceRecords =
      await supabaseFetch(
        query
      );


    if (
      !Array.isArray(
        serviceRecords
      )
    ) {

      serviceRecords = [];

    }


    renderServices();

  } catch(error) {

    console.error(
      "Service load error:",
      error
    );


    serviceRecords = [];

    renderServices();


    alert(
      "施術データの読み込みに失敗しました。\n\n" +
      error.message
    );

  }

}


/* =========================================================
   RENDER SERVICES
========================================================= */

function renderServices() {

  const tbody =
    document.getElementById(
      "serviceTableBody"
    );


  let total =
    0;

  let cash =
    0;

  let card =
    0;


  serviceRecords.forEach(
    record => {

      const amount =
        getServiceAmount(
          record
        );


      total +=
        amount;


      const payment =
        getServicePayment(
          record
        );


      if (
        payment ===
        "現金"
      ) {

        cash +=
          amount;

      }


      if (
        payment ===
        "クレジットカード"
      ) {

        card +=
          amount;

      }

    }
  );


  document.getElementById(
    "serviceCount"
  ).textContent =
    serviceRecords.length;


  document.getElementById(
    "serviceSales"
  ).textContent =
    formatYen(
      total
    );


  document.getElementById(
    "serviceCash"
  ).textContent =
    formatYen(
      cash
    );


  document.getElementById(
    "serviceCard"
  ).textContent =
    formatYen(
      card
    );


  if (
    !serviceRecords.length
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty-row"
        >
          施術データがありません。
        </td>
      </tr>
    `;

    return;

  }


  tbody.innerHTML =
    serviceRecords
      .map(
        record => {

          const staffName =
            getStaffName(
              getServiceStaffId(
                record
              )
            );


          const displayStaff =
            staffName !== "-"
              ? staffName
              : (
                  record.staff_name ||
                  "-"
                );


          return `
            <tr>

              <td>
                ${escapeHtml(
                  formatDateJP(
                    getServiceDate(
                      record
                    )
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  formatTime(
                    getServiceTime(
                      record
                    )
                  )
                )}
              </td>

              <td>
                ${escapeHtml(
                  getServiceCustomer(
                    record
                  ) ||
                  "-"
                )}
              </td>

              <td>
                ${escapeHtml(
                  displayStaff
                )}
              </td>

              <td>
                <span class="badge">
                  ${escapeHtml(
                    getServicePayment(
                      record
                    ) ||
                    "-"
                  )}
                </span>
              </td>

              <td>
                ${formatYen(
                  getServiceAmount(
                    record
                  )
                )}
              </td>

              <td>

                <div class="action-cell">

                  <button
                    class="btn btn-small"
                    onclick="openServiceModal('${record.id}')"
                  >
                    編集
                  </button>

                </div>

              </td>

            </tr>
          `;

        }
      )
      .join("");

}

/* =========================================================
   SAVE SERVICE
========================================================= */

async function saveService() {

  const id =
    document.getElementById(
      "editServiceId"
    ).value;


  const serviceDate =
    document.getElementById(
      "editServiceDate"
    ).value;


  const serviceTime =
    document.getElementById(
      "editServiceTime"
    ).value;


  const customerName =
    document.getElementById(
      "editCustomerName"
    ).value.trim();


  const staffId =
    document.getElementById(
      "editServiceStaff"
    ).value;


  const paymentMethod =
    document.getElementById(
      "editPaymentMethod"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "editServiceAmount"
      ).value ||
      0
    );


  const note =
    document.getElementById(
      "editServiceNote"
    ).value.trim();


  if (
    !serviceDate
  ) {

    alert(
      "日付を入力してください。"
    );

    return;

  }


  if (
    !staffId
  ) {

    alert(
      "スタッフを選択してください。"
    );

    return;

  }


  const data = {

    service_date:
      serviceDate,

    service_time:
      serviceTime ||
      null,

    customer_name:
      customerName ||
      null,

    staff_id:
      staffId,

    payment_method:
      paymentMethod,

    amount:
      amount,

    note:
      note ||
      null

  };


  try {

    if (id) {

      await supabaseFetch(
        `/service_records?id=eq.${encodeURIComponent(id)}`,
        {
          method:
            "PATCH",

          headers: {
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              data
            )
        }
      );


      alert(
        "保存しました"
      );

    } else {

      await supabaseFetch(
        "/service_records",
        {
          method:
            "POST",

          headers: {
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              data
            )
        }
      );


      alert(
        "登録しました"
      );

    }


    closeServiceModal();

    await loadServices();

    await loadHome();

  } catch(error) {

    console.error(
      "Service save error:",
      error
    );


    alert(
      "保存に失敗しました\n\n" +
      error.message
    );

  }

}

/* =========================================================
   CSV
========================================================= */

function downloadCSV(
  filename,
  rows
) {

  if (
    !rows ||
    !rows.length
  ) {

    alert(
      "出力するデータがありません。"
    );

    return;

  }


  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value => {

                const text =
                  String(
                    value ??
                    ""
                  );

                return (
                  '"' +
                  text.replace(
                    /"/g,
                    '""'
                  ) +
                  '"'
                );

              }
            )
            .join(",")
      )
      .join("\r\n");


  const bom =
    "\uFEFF";


  const blob =
    new Blob(
      [
        bom +
        csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  URL.revokeObjectURL(
    url
  );

}
